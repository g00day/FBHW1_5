<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка рыболовной снасти</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="product-card">
        <div class="product-card__image">
            <img src="images/fishing-reel.jpg">
        </div>
        <div class="product-card__content">
            <h3 class="product-card__title">Катушка безынерционная Daiwa Ninja</h3>
            <div class="product-card__rating">
                <span class="product-card__stars">★★★★★</span>
                <span class="product-card__reviews">(24 отзыва)</span>
            </div>
            <p class="product-card__description">
                Японская безынерционная катушка с 5 подшипниками. 
                Углеродный тормоз, алюминиевая шпуля, передаточное число 5.2:1.
                Идеально подходит для спиннинговой ловли щуки и окуня.
            </p>
            <div class="product-card__specs">
                <span class="product-card__spec">Размер: 2500</span>
                <span class="product-card__spec">Вес: 285 г</span>
                <span class="product-card__spec">Леска: 0.25-0.30 мм</span>
            </div>
            <div class="product-card__footer">
                <span class="product-card__price">4 990 ₽</span>
                <button class="product-card__button">В корзину</button>
            </div>
        </div>
    </div>
</body>
</html>
